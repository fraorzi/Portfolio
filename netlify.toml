[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://franciszek-orzechowski.com/*"
  to = "https://franciszek-orzechowski.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.franciszek-orzechowski.com/*"
  to = "https://franciszek-orzechowski.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://franciszekorzechowski.pl/*"
  to = "https://franciszek-orzechowski.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.franciszekorzechowski.pl/*"
  to = "https://franciszek-orzechowski.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://franciszekorzechowski.com/*"
  to = "https://franciszek-orzechowski.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.franciszekorzechowski.com/*"
  to = "https://franciszek-orzechowski.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
